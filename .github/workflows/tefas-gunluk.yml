name: TEFAS Gunluk Veri Cekme

# TSI 10:10 = UTC 07:10, TSI 12:00 = UTC 09:00 (Turkiye UTC+3, yaz saati yok)
# Hafta ici her gun (Pazartesi-Cuma), GitHub'in cron'u UTC kullanir.
#
# IKI FARKLI SAATTE CALISIR:
#   1) TSI ~10:06 - normal calisma zamani
#   2) TSI ~11:33 - bazi fonlarin fiyati TEFAS'ta gecikmeli aciklanabiliyor,
#      bu ikinci calisma o gunku eksik kalan fonlari tamamlamak icin var.
#      Script zaten "en son yayinlanan gunu" arayip GERIYE BAKARAK calisiyor
#      (tefas_gunluk.py icindeki son_yayinlanan_gunu_bul fonksiyonu), yani
#      bu ikinci calisma ayni gunun eksik kalan fonlarini otomatik tamamlar,
#      mukerrer veri olusturmaz (drop_duplicates zaten fon+gun bazinda
#      en son geleni tutuyor).
#
# ONEMLI - NEDEN TAM SAAT DEGIL (7:10, 9:00 gibi) DA 7:06, 8:33 GIBI TUHAF
# DAKIKALAR SECILDI: GitHub Actions'in schedule tetikleyicisi, YUVARLAK
# UTC saatlerinde (00:00, 07:00, 09:00 gibi) COK YOGUN oluyor - binlerce
# repo ayni dakikada tetiklenmeye calisiyor, GitHub bunlari kuyruga alip
# saatlerce erteleyebiliyor (5-20 dakika degil, GOZLEMLENEN gecikme bazen
# 3-9 saat oldu). Tuhaf/rastgele dakikalar (06, 33 gibi) bu yogunluk
# noktalarindan kacinip gecikme riskini azaltir - GitHub'in kendi onerisi
# budur. Yine de GARANTI bir calisma saati YOKTUR; bu yuzden dashboard'da
# ayrica bir "veri X saatten eskiyse uyar" kontrolu eklendi (index.html).
on:
  schedule:
    - cron: '6 7 * * 1-5'
    - cron: '33 8 * * 1-5'
  workflow_dispatch:  # "Run workflow" butonuyla elle de tetiklenebilir

jobs:
  veri-cek:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerekli kutuphaneleri kur
        run: pip install pytefas pandas pyarrow requests cryptography

      - name: Git kimligini ayarla
        run: |
          git config user.name "tefas-otomasyon"
          git config user.email "tefas-otomasyon@users.noreply.github.com"

      - name: TEFAS verisini cek, sifrele, gonder
        env:
          TEFAS_PANO_SIFRE: ${{ secrets.TEFAS_PANO_SIFRE }}
          HOME: ${{ github.workspace }}
        run: python tefas_ana.py
