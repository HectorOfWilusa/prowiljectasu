name: TEFAS Islem Isle

# Bu workflow, dashboard'dan (index.html) acilan ozel formatli bir Issue
# yakaladiginda calisir. Issue basligi "[TEFAS-ISLEM]" ile baslamalidir -
# dashboard formu bunu otomatik olarak boyle acar. Baska amacli Issue'lar
# (orn. elle acilan hata bildirimleri) bu workflow'u TETIKLEMEZ.

on:
  issues:
    types: [opened]

permissions:
  # Bu workflow'un KENDI GITHUB_TOKEN'i - otomatik uretilir, sadece bu
  # calisma sirasinda gecerlidir. Dashboard'daki token'dan TAMAMEN AYRIDIR.
  # contents:write -> islemler.csv, portfoyum_*.csv, sifreli/ dosyalarina
  #                    commit atabilmek icin sart
  # issues:write    -> Issue'ya yorum yazip kapatabilmek icin sart
  contents: write
  issues: write

jobs:
  islem-isle:
    # Sadece basligi "[TEFAS-ISLEM]" ile baslayan Issue'larda calisir -
    # baska turden Issue'lar (bug report, soru, vs.) bu is akisini tetiklemez.
    if: startsWith(github.event.issue.title, '[TEFAS-ISLEM]')
    runs-on: ubuntu-latest
    env:
      # ONEMLI: tefas_issue_isle.py, tefas_portfoy_degerle.py ve
      # tefas_sifrele.py, VERI_KLASORU'nu Path.home() / "TEFAS_VERI" olarak
      # hesapliyor. HOME burada ACIKCA AYARLANMAZSA, GitHub Actions
      # runner'inin varsayilan HOME'u (/home/runner) kullanilir - ki repo
      # ORADA DEGIL, /home/runner/work/... altinda. Bu yuzden
      # master_info.parquet gibi dosyalar "bulunamadi" hatasi verir.
      # tefas-gunluk.yml'de bu zaten dogru ayarliydi, burada da AYNI
      # SEKILDE (job genelinde, tum adimlara uygulanacak sekilde)
      # ayarlaniyor ki Path.home() = repo koku olsun.
      HOME: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pandas pyarrow cryptography

      - name: Islemi isle (islemler.csv guncelle + FIFO hesapla)
        id: isle
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python tefas_issue_isle.py

      # ONEMLI: Yukaridaki adim sadece HAM CSV'leri (islemler.csv,
      # portfoyum_ozet.csv, portfoyum_lot_bazli.csv) gunceller. Dashboard
      # ise bunlari DEGIL, bunlarin SIFRELENMIS halini (sifreli/*.enc.json)
      # okuyor. O yuzden burada EK OLARAK portfoy degerlemesini yeniden
      # hesaplayip (yeni eklenen/degisen pay sayilariyla), sonra sifreleyip
      # GitHub'a gondermemiz lazim - yoksa Issue basariyla kapansa da
      # dashboard'da hicbir degisiklik GORUNMEZ (bir sonraki gunluk
      # otomasyon calisana kadar).
      #
      # NOT: master_info.parquet (guncel fiyatlar) zaten repoda mevcut -
      # bu adim TEFAS'a yeniden baglanmiyor, sadece var olan veriyle
      # portfoyu yeniden degerliyor.
      - name: Portfoy degerlemesini yenile
        if: success()
        run: python tefas_portfoy_degerle.py

      - name: Guncel veriyi sifrele
        if: success()
        env:
          TEFAS_PANO_SIFRE: ${{ secrets.TEFAS_PANO_SIFRE }}
        run: python tefas_sifrele.py

      - name: Degisiklikleri commit'le ve gonder
        if: success()
        run: |
          git config user.name "tefas-islem-bot"
          git config user.email "bot@users.noreply.github.com"
          git add islemler.csv portfoyum_ozet.csv portfoyum_lot_bazli.csv sifreli/
          git diff --staged --quiet || git commit -m "Islem eklendi: Issue #${{ github.event.issue.number }}"

          # Ayni anda gunluk otomasyon (tefas-gunluk.yml) da calisiyor
          # olabilir - push reddedilirse (baska bir calisma once push
          # etmis olabilir), degisiklikleri cekip tekrar deniyoruz.
          for deneme in 1 2 3; do
            if git push; then
              echo "Push basarili (deneme $deneme)."
              break
            fi
            if [ "$deneme" -eq 3 ]; then
              echo "Push 3 denemeden sonra basarisiz kaldi."
              exit 1
            fi
            echo "Push reddedildi, uzaktaki degisiklikler cekilip tekrar denenecek (deneme $deneme)."
            git pull --rebase
          done

      - name: Basarili - Issue'ya yorum ekle ve kapat
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ İşlem başarıyla eklendi ve portföy güncellendi.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Basarisiz - Issue'ya hata yorumu ekle
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ İşlem işlenirken bir hata oluştu. Lütfen girdiğiniz bilgileri kontrol edip tekrar deneyin, veya Actions sekmesindeki log kaydına bakın.\n\nBu Issue kapatılmadı, sorunu inceleyip tekrar bu formatta yeni bir işlem gönderebilirsiniz.'
            });
